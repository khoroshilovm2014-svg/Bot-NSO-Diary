# ===========================================================================
# Render — конфигурация веб-сервиса (бесплатный тариф)
# Документ: https://render.com/docs/blueprint-spec
#
# Как использовать:
#   1. Загрузите папку bot/ в репозиторий GitHub.
#   2. Render → New → Blueprint → выберите репозиторий.
#   3. Render сам прочитает этот файл.
#   4. В разделе Environment впишите секреты (sync: false = значения вводите вручную).
#
# Адрес сервиса: https://<имя>.onrender.com — HTTPS, домен уже есть.
# ===========================================================================

services:
  - type: web
    name: nso-diary-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Секреты — значения задаются в панели Render, не в этом файле.
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: nso_diary_bot
      - key: WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://surbkjmviyyvvrajhjkp.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # Адрес сервиса Render подставляется вручную после первого деплоя.
      - key: PUBLIC_BASE
        sync: false

      - key: CORS_ORIGINS
        value: https://diary-nso.vercel.app,http://localhost:5500
      - key: DEMO_MODE
        value: "0"
      - key: AUTO_TUNNEL
        value: "0"
